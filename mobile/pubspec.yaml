name: toolshare
description: Neighborhood tool rental — rent idle tools from neighbors for a few dollars a day.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^13.0.0
  intl: ^0.19.0
  # Production wiring (add when connecting real services):
  # firebase_core / firebase_auth  — Sign in with Apple, Google, phone OTP
  # flutter_stripe                 — PaymentSheet: Apple Pay + Google Pay
  # firebase_messaging             — push notifications
  # image_picker                   — listing photos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
